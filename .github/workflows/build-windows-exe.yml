name: Build Windows Desktop EXE Installer

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: ⚙️ Setup PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📦 Install PNPM Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Web & Desktop Frontend
        run: pnpm build

      - name: 🪟 Build Tauri Windows Installer (.exe & .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./apps/desktop
          tagName: v1.0.0-${{ github.run_number }}
          releaseName: 'Inventory POS System v1.0.0 (Build ${{ github.run_number }})'
          releaseBody: 'Official Windows Desktop Installer (.exe) for Enterprise Inventory, POS, Wholesale Trade & Khata Management System.'
          releaseDraft: false
          prerelease: false

      - name: 📤 Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-POS-Windows-Installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
