<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="houseGradient" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="roofGradient" x1="10" y1="10" x2="190" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="boardGradient" x1="60" y1="70" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="penGradient" x1="120" y1="70" x2="175" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- 1. Outer House Foundation & Walls -->
  <path d="M32 92 L100 32 L168 92 V170 C168 176.627 162.627 182 156 182 H44 C37.373 182 32 176.627 32 170 V92 Z" fill="url(#houseGradient)" stroke="#3b82f6" stroke-width="4" />
  <!-- Chimney -->
  <path d="M142 62 V42 H158 V76 L142 62 Z" fill="#1e40af" />
  <!-- Roof -->
  <path d="M16 94 L100 20 L184 94 L170 106 L100 44 L30 106 L16 94 Z" fill="url(#roofGradient)" />
  <circle cx="100" cy="22" r="5" fill="url(#goldAccent)" />

  <!-- 2. Inside: Ledger Board / Takhti / Clipboard -->
  <g transform="translate(0, 5)">
    <rect x="58" y="76" width="84" height="96" rx="8" fill="url(#boardGradient)" stroke="#94a3b8" stroke-width="3" />
    <!-- Clip Top -->
    <path d="M82 72 C82 68.686 84.686 66 88 66 H112 C115.314 66 118 68.686 118 72 V79 H82 V72 Z" fill="url(#goldAccent)" />
    <circle cx="100" cy="71" r="2.5" fill="#ffffff" />
    <!-- Lines -->
    <line x1="70" y1="92" x2="114" y2="92" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
    <line x1="70" y1="106" x2="130" y2="106" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="70" y1="120" x2="126" y2="120" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="70" y1="134" x2="120" y2="134" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="70" y1="148" x2="108" y2="148" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <!-- Checkmark -->
    <path d="M124 144 L129 149 L138 140" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 3. Fountain Pen / Qalam -->
  <g transform="rotate(-38 145 125)">
    <rect x="135" y="45" width="14" height="68" rx="4" fill="url(#penGradient)" stroke="#065f46" stroke-width="1.5" />
    <rect x="134" y="60" width="16" height="4" fill="url(#goldAccent)" />
    <polygon points="135,113 149,113 146,132 138,132" fill="#0f172a" />
    <polygon points="138,132 146,132 142,148" fill="url(#goldAccent)" stroke="#b45309" stroke-width="1" />
    <line x1="142" y1="133" x2="142" y2="145" stroke="#047857" stroke-width="1.5" />
    <circle cx="142" cy="138" r="1" fill="#047857" />
  </g>
</svg>
